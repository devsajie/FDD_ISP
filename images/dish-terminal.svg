<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="50%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <filter id="dishGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="8" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="112" x2="600" y2="112"/>
    <line x1="0" y1="225" x2="600" y2="225"/>
    <line x1="0" y1="337" x2="600" y2="337"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
  </g>

  <!-- Sky Link Signal Waves -->
  <path d="M260,80 Q320,40 380,80" fill="none" stroke="#00e676" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M240,60 Q320,15 400,60" fill="none" stroke="#00e676" stroke-width="2" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
  </path>

  <!-- Heavy Base Tripod Mount -->
  <polygon points="170,410 430,410 400,390 200,390" fill="url(#standGrad)"/>
  <rect x="288" y="270" width="24" height="130" fill="url(#standGrad)"/>
  
  <!-- Motorized Pivot Joint -->
  <circle cx="300" cy="265" r="18" fill="#1a202c" stroke="#4a5568" stroke-width="3"/>
  <circle cx="300" cy="265" r="6" fill="#718096"/>

  <!-- Tilted Phased Array Dish Surface -->
  <!-- Dish Mast Connector -->
  <line x1="300" y1="265" x2="320" y2="175" stroke="#2d3748" stroke-width="14" stroke-linecap="round"/>

  <!-- Rectangular Tilted Dish -->
  <g transform="translate(320, 160) rotate(-22)">
    <!-- Back Housing Plate -->
    <rect x="-145" y="-95" width="290" height="190" rx="20" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <!-- Front Phased Array Face -->
    <rect x="-138" y="-88" width="276" height="176" rx="16" fill="url(#dishGrad)"/>
    
    <!-- Micro Phased Array Element Matrix Grid -->
    <g fill="#94a3b8" opacity="0.35">
      <circle cx="-100" cy="-60" r="2.5"/><circle cx="-60" cy="-60" r="2.5"/><circle cx="-20" cy="-60" r="2.5"/><circle cx="20" cy="-60" r="2.5"/><circle cx="60" cy="-60" r="2.5"/><circle cx="100" cy="-60" r="2.5"/>
      <circle cx="-100" cy="-30" r="2.5"/><circle cx="-60" cy="-30" r="2.5"/><circle cx="-20" cy="-30" r="2.5"/><circle cx="20" cy="-30" r="2.5"/><circle cx="60" cy="-30" r="2.5"/><circle cx="100" cy="-30" r="2.5"/>
      <circle cx="-100" cy="0" r="2.5"/><circle cx="-60" cy="0" r="2.5"/><circle cx="-20" cy="0" r="2.5"/><circle cx="20" cy="0" r="2.5"/><circle cx="60" cy="0" r="2.5"/><circle cx="100" cy="0" r="2.5"/>
      <circle cx="-100" cy="30" r="2.5"/><circle cx="-60" cy="30" r="2.5"/><circle cx="-20" cy="30" r="2.5"/><circle cx="20" cy="30" r="2.5"/><circle cx="60" cy="30" r="2.5"/><circle cx="100" cy="30" r="2.5"/>
      <circle cx="-100" cy="60" r="2.5"/><circle cx="-60" cy="60" r="2.5"/><circle cx="-20" cy="60" r="2.5"/><circle cx="20" cy="60" r="2.5"/><circle cx="60" cy="60" r="2.5"/><circle cx="100" cy="60" r="2.5"/>
    </g>

    <!-- NST Dish Badge -->
    <text x="0" y="5" fill="#475569" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="3" text-anchor="middle">NST ELECTRONIC ARRAY</text>
    
    <!-- Active Status Beacon -->
    <circle cx="115" cy="-68" r="4" fill="#00e676" filter="url(#dishGlow)"/>
  </g>

  <!-- Weather Shield & Spec Tags -->
  <rect x="25" y="25" width="135" height="28" rx="4" fill="rgba(255,255,255,0.06)" stroke="#334155" stroke-width="1"/>
  <text x="35" y="43" fill="#00e676" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">● IP56 HEATED DISH</text>

  <rect x="25" y="60" width="165" height="28" rx="4" fill="rgba(255,255,255,0.06)" stroke="#334155" stroke-width="1"/>
  <text x="35" y="78" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">SELF-ORIENTING MOTOR</text>
</svg>
