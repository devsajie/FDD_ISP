<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="orbitBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040812"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="leoBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="geoBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#ff5252" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="8" fill="url(#orbitBg)"/>

  <!-- Earth Surface Curve -->
  <path d="M0,380 Q300,310 600,380 L600,400 L0,400 Z" fill="#0f1f33"/>
  <path d="M0,380 Q300,310 600,380" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="300" y="385" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="2">EARTH SURFACE (KATHMANDU VALLEY)</text>

  <!-- GEO Orbit Level (35,786 km) -->
  <line x1="40" y1="60" x2="560" y2="60" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="50" y="52" fill="#ff5252" font-family="'Inter', sans-serif" font-size="10" font-weight="700">GEO SATELLITE (35,786 km) — LATENCY ~600ms</text>
  
  <!-- GEO Satellite Icon -->
  <g transform="translate(180, 60)">
    <rect x="-10" y="-8" width="20" height="16" fill="#ff5252" rx="2"/>
    <line x1="-22" y1="0" x2="-10" y2="0" stroke="#ff5252" stroke-width="3"/>
    <line x1="10" y1="0" x2="22" y2="0" stroke="#ff5252" stroke-width="3"/>
  </g>
  <!-- GEO Beam down to Kathmandu (Laggy long beam) -->
  <line x1="180" y1="68" x2="280" y2="345" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- LEO Orbit Level (550 km) -->
  <line x1="40" y1="190" x2="560" y2="190" stroke="#00e676" stroke-width="1.5"/>
  <text x="50" y="182" fill="#00e676" font-family="'Inter', sans-serif" font-size="10" font-weight="800">NEPAL SPACE TELECOM LEO (550 km) — LATENCY &lt;25ms</text>

  <!-- LEO Mesh Satellites -->
  <g transform="translate(320, 190)">
    <rect x="-12" y="-7" width="24" height="14" fill="#ffffff" rx="2"/>
    <rect x="-24" y="-5" width="10" height="10" fill="#00e676"/>
    <rect x="14" y="-5" width="10" height="10" fill="#00e676"/>
    <circle cx="0" cy="0" r="3" fill="#00e676" filter="url(#pGlow)"/>
  </g>
  <!-- LEO Beam direct to Kathmandu (Short instant beam) -->
  <polygon points="320,197 300,345 340,345" fill="url(#leoBeam)"/>

  <!-- Ground Terminal at Kathmandu -->
  <circle cx="320" cy="345" r="5" fill="#00e676" filter="url(#pGlow)"/>
  <text x="320" y="365" fill="#00e676" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">NST Dish</text>

  <!-- Advantage Metrics Tag Box -->
  <g transform="translate(390, 85)">
    <rect width="180" height="75" rx="6" fill="rgba(0,230,118,0.06)" stroke="#00e676" stroke-width="1"/>
    <text x="12" y="22" fill="#00e676" font-family="'Inter', sans-serif" font-size="10" font-weight="800">65x CLOSER TO EARTH</text>
    <text x="12" y="42" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9">• Zero audio/video lag</text>
    <text x="12" y="58" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9">• Real-time online gaming</text>
  </g>
</svg>
