<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <radialGradient id="valleyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00e676" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
    </radialGradient>
    <filter id="sigGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="8" fill="url(#mapBg)"/>

  <!-- Valley Mountain Basin Ridge Contour -->
  <path d="M70,90 Q150,50 300,60 Q450,50 530,110 Q560,230 520,340 Q440,410 300,400 Q140,410 80,320 Q50,200 70,90 Z" fill="#0d1829" stroke="#1e293b" stroke-width="2"/>

  <!-- Valley Coverage Area Glow -->
  <ellipse cx="300" cy="230" rx="190" ry="140" fill="url(#valleyGlow)"/>

  <!-- Radar Coordinates & Rings -->
  <circle cx="300" cy="230" r="160" fill="none" stroke="#00e676" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="300" cy="230" r="110" fill="none" stroke="#00e676" stroke-width="1" stroke-dasharray="3 4" opacity="0.4"/>
  <circle cx="300" cy="230" r="60" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0.6"/>

  <line x1="140" y1="230" x2="460" y2="230" stroke="#00e676" stroke-width="1" opacity="0.25"/>
  <line x1="300" y1="90" x2="300" y2="370" stroke="#00e676" stroke-width="1" opacity="0.25"/>

  <!-- Node Locations in Kathmandu -->
  <!-- Maitidevi NST HQ & Gateway -->
  <g transform="translate(320, 215)">
    <circle cx="0" cy="0" r="7" fill="#00e676" filter="url(#sigGlow)"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0.7">
      <animate attributeName="r" values="7;24" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="12" y="-12" width="130" height="22" rx="3" fill="#020617" stroke="#00e676" stroke-width="1"/>
    <text x="18" y="3" fill="#00e676" font-family="'Inter', sans-serif" font-size="9" font-weight="800">MAITIDEVI (NST HQ)</text>
  </g>

  <!-- Thamel Node -->
  <circle cx="260" cy="180" r="4" fill="#ffffff"/>
  <text x="210" y="175" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Thamel</text>

  <!-- Baneshwor Node -->
  <circle cx="350" cy="250" r="4" fill="#ffffff"/>
  <text x="360" y="254" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Baneshwor</text>

  <!-- Patan / Lalitpur Node -->
  <circle cx="270" cy="285" r="4" fill="#ffffff"/>
  <text x="220" y="300" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Patan / Lalitpur</text>

  <!-- Bhaktapur Node -->
  <circle cx="430" cy="270" r="4" fill="#ffffff"/>
  <text x="440" y="274" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Bhaktapur</text>

  <!-- Map Header Legend -->
  <rect x="25" y="25" width="220" height="32" rx="4" fill="rgba(0,0,0,0.7)" stroke="#1e293b" stroke-width="1"/>
  <text x="35" y="45" fill="#00e676" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="1">PHASE 1: KATHMANDU VALLEY</text>

  <!-- Status Box Bottom Right -->
  <rect x="375" y="390" width="200" height="36" rx="4" fill="rgba(0,0,0,0.8)" stroke="#00e676" stroke-width="1"/>
  <text x="390" y="412" fill="#00e676" font-family="'Inter', sans-serif" font-size="10" font-weight="700">● 100% BEAM COVERAGE</text>
</svg>
