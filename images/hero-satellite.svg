<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020308"/>
      <stop offset="50%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#091b29"/>
      <stop offset="50%" stop-color="#123a54"/>
      <stop offset="100%" stop-color="#081825"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#00e676" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#19335a"/>
      <stop offset="50%" stop-color="#2a5288"/>
      <stop offset="100%" stop-color="#19335a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="1200" height="500" fill="url(#spaceGrad)"/>

  <!-- Stars Field -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="50" r="1.2"/>
    <circle cx="150" cy="120" r="1"/>
    <circle cx="230" cy="40" r="1.5" opacity="0.9"/>
    <circle cx="340" cy="90" r="1.2"/>
    <circle cx="480" cy="60" r="1"/>
    <circle cx="560" cy="140" r="1.8" opacity="0.9"/>
    <circle cx="670" cy="30" r="1"/>
    <circle cx="780" cy="80" r="1.4"/>
    <circle cx="890" cy="110" r="1"/>
    <circle cx="950" cy="40" r="1.6" opacity="0.8"/>
    <circle cx="1060" cy="75" r="1.2"/>
    <circle cx="1140" cy="130" r="1"/>
    <circle cx="90" cy="220" r="1"/>
    <circle cx="200" cy="180" r="1.4"/>
    <circle cx="1080" cy="240" r="1.5"/>
  </g>

  <!-- Orbital Track Line -->
  <path d="M-50,220 Q600,100 1250,190" fill="none" stroke="#253549" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Earth Curvature Atmosphere -->
  <path d="M-100,560 Q600,320 1300,560" fill="url(#earthGrad)"/>
  <path d="M-100,560 Q600,320 1300,560" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0.4" filter="url(#glow)"/>

  <!-- Himalayan Mountain Silhouette Outline -->
  <path d="M150,440 L280,380 L350,420 L440,360 L510,410 L620,340 L710,400 L820,350 L910,410 L1020,370 L1100,430 L1100,500 L150,500 Z" fill="#040b12" opacity="0.85"/>

  <!-- Downlink Beam to Kathmandu -->
  <polygon points="600,165 480,430 720,430" fill="url(#beamGrad)" opacity="0.6"/>

  <!-- Ground Terminal Beacon in Kathmandu Valley -->
  <circle cx="600" cy="430" r="4" fill="#00e676" filter="url(#glow)"/>
  <circle cx="600" cy="430" r="14" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0.7">
    <animate attributeName="r" values="4;24" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="460" fill="#a1a1a1" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" letter-spacing="2">MAITIDEVI GROUND GATEWAY</text>

  <!-- LEO Satellite Body -->
  <g transform="translate(600, 160)">
    <!-- Left Solar Array -->
    <rect x="-140" y="-18" width="90" height="36" rx="3" fill="url(#panelGrad)" stroke="#39669e" stroke-width="1"/>
    <line x1="-110" y1="-18" x2="-110" y2="18" stroke="#39669e" stroke-width="0.8"/>
    <line x1="-80" y1="-18" x2="-80" y2="18" stroke="#39669e" stroke-width="0.8"/>
    <line x1="-140" y1="0" x2="-50" y2="0" stroke="#39669e" stroke-width="0.8"/>
    <!-- Array Arm Left -->
    <rect x="-50" y="-3" width="22" height="6" fill="#888888"/>

    <!-- Central Satellite Bus Chassis -->
    <rect x="-28" y="-22" width="56" height="44" rx="4" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
    <!-- Phased Array Antenna Panel Below -->
    <rect x="-22" y="14" width="44" height="12" rx="2" fill="#222222" stroke="#00e676" stroke-width="1"/>
    <circle cx="0" cy="20" r="3" fill="#00e676" filter="url(#glow)"/>
    
    <!-- Detail Markings -->
    <text x="0" y="2" fill="#111111" font-family="'Inter', sans-serif" font-size="7" font-weight="800" text-anchor="middle" letter-spacing="1">NST-LEO</text>
    <rect x="-20" y="-16" width="40" height="4" fill="#333333"/>

    <!-- Right Solar Array Arm -->
    <rect x="28" y="-3" width="22" height="6" fill="#888888"/>
    <!-- Right Solar Array -->
    <rect x="50" y="-18" width="90" height="36" rx="3" fill="url(#panelGrad)" stroke="#39669e" stroke-width="1"/>
    <line x1="80" y1="-18" x2="80" y2="18" stroke="#39669e" stroke-width="0.8"/>
    <line x1="110" y1="-18" x2="110" y2="18" stroke="#39669e" stroke-width="0.8"/>
    <line x1="50" y1="0" x2="140" y2="0" stroke="#39669e" stroke-width="0.8"/>
  </g>
</svg>
