<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="routerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="routerBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <linearGradient id="bgR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <filter id="ledGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="8" fill="url(#bgR)"/>

  <!-- Wi-Fi 6 Radio Waves Emitting -->
  <g fill="none" stroke="url(#glowG)" stroke-width="2" opacity="0.35">
    <path d="M190,130 A 130 130 0 0 1 410 130">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M220,150 A 90 90 0 0 1 380 150">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M250,170 A 55 55 0 0 1 350 170">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Router Tower Reflection/Shadow -->
  <ellipse cx="300" cy="405" rx="110" ry="16" fill="#000000" opacity="0.8"/>

  <!-- Main Router Monolith Chassis -->
  <path d="M235,170 L245,390 L355,390 L365,170 Q300,165 235,170 Z" fill="url(#routerGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- Router Front Ridge / Facet Design -->
  <path d="M295,167 L295,390" stroke="#000000" stroke-width="2" opacity="0.6"/>

  <!-- Glowing Vertical LED Light Strip -->
  <rect x="298" y="190" width="4" height="150" rx="2" fill="url(#glowG)" filter="url(#ledGlow)"/>

  <!-- Router Base Footing -->
  <ellipse cx="300" cy="390" rx="60" ry="12" fill="url(#routerBase)" stroke="#475569" stroke-width="1"/>

  <!-- NST & Wi-Fi 6 Logo Branding -->
  <text x="300" y="370" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="2" text-anchor="middle">NST WI-FI 6</text>

  <!-- Spec Tag Indicators -->
  <rect x="25" y="25" width="165" height="28" rx="4" fill="rgba(255,255,255,0.06)" stroke="#334155" stroke-width="1"/>
  <text x="35" y="43" fill="#00e676" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">● 802.11ax TRI-BAND</text>

  <rect x="25" y="60" width="180" height="28" rx="4" fill="rgba(255,255,255,0.06)" stroke="#334155" stroke-width="1"/>
  <text x="35" y="78" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">UP TO 2,000 SQ FT (185 m²)</text>

  <rect x="390" y="25" width="185" height="28" rx="4" fill="rgba(255,255,255,0.06)" stroke="#334155" stroke-width="1"/>
  <text x="400" y="43" fill="#00b0ff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1">2x GIGABIT LAN PORTS</text>
</svg>
